name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
        wp: [ '6.9', 'latest' ]

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Composer bağımlılıkları
        run: composer install --no-interaction --no-progress

      - name: Node bağımlılıkları
        run: npm ci --no-audit --no-fund

      - name: PHPCS
        run: composer phpcs

      - name: PHPStan
        run: composer phpstan

      - name: Birim testleri
        run: composer test:unit

      - name: WordPress sürümünü seç
        if: matrix.wp != 'latest'
        run: echo "WP_ENV_CORE=https://wordpress.org/wordpress-${{ matrix.wp }}.zip" >> "$GITHUB_ENV"

      - name: wp-env başlat
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npx wp-env start

      - name: Ortam sürümleri
        run: |
          npx wp-env run cli php -v
          npx wp-env run cli wp core version

      - name: Entegrasyon testleri
        shell: bash
        run: |
          set -o pipefail
          composer test:integration 2>&1 | tee integration.log

      - name: WP-CLI komutu
        run: |
          npx wp-env run cli wp aihs hits report --days=28 --format=table
          npx wp-env run cli wp aihs hits report --days=7 --format=csv

      - name: Entegrasyon hata özeti
        if: failure()
        shell: bash
        run: |
          [ -f integration.log ] || exit 0
          summary=$(tail -n 60 integration.log | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Entegrasyon testleri::${summary}"

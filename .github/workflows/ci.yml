name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
        wp: [ '6.9', 'latest' ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Composer bağımlılıkları
        run: composer install --no-interaction --no-progress

      - name: Node bağımlılıkları
        run: npm ci --no-audit --no-fund

      - name: PHPCS
        run: composer phpcs

      - name: PHPStan
        run: composer phpstan

      - name: Birim testleri
        run: composer test:unit

      - name: WordPress sürümünü seç
        if: matrix.wp != 'latest'
        run: echo "WP_ENV_CORE=https://wordpress.org/wordpress-${{ matrix.wp }}.zip" >> "$GITHUB_ENV"

      - name: wp-env başlat
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npx wp-env start

      - name: Ortam sürümleri
        run: |
          npx wp-env run cli php -v
          npx wp-env run cli wp core version

      - name: Entegrasyon testleri
        run: composer test:integration
